name: Cron Scrape Normas

on:
  schedule:
    # 6:00 AM and 1:00 PM Peru time (UTC-5)
    # UTC time: 11:00 AM and 6:00 PM
    - cron: "0 11,18 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scrape
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Error: APP_URL secret is not set in GitHub Secrets."
            echo "Please go to Settings > Secrets and variables > Actions and add APP_URL."
            exit 1
          fi
          # Usar -L para seguir redirecciones y --fail para detectar errores
          curl -v -L --fail -X POST "$APP_URL/api/scrape-normas"
